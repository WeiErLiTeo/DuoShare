name: Mirror anime GIFs into this repository

on:
  workflow_dispatch:
  push:
    paths:
      - README.md
      - scripts/mirror_anime_gifs.py
      - .github/workflows/mirror-anime-gifs.yml

permissions:
  contents: write

concurrency:
  group: mirror-anime-gifs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Mirror available GIFs
        run: python scripts/mirror_anime_gifs.py

      - name: Commit local images and README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md image/
          if git diff --cached --quiet; then
            echo "No local GIFs or README changes to commit."
          else
            git commit -m "chore: mirror anime GIF assets locally"
            git push
          fi
