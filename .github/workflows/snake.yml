name: Generate colorful contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light, dark and rainbow snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: WeiErLiTeo
          outputs: |
            github-snake.svg?palette=github-light&color_snake=%23ff4fa3
            github-snake-dark.svg?palette=github-dark&color_snake=%2300f5d4
            github-snake.gif?color_snake=%23ff4fa3&color_dots=%231b1029,%239b5de5,%2300bbf9,%2300f5d4,%23fee440&color_background=%230d1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
